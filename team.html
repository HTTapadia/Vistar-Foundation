<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Team — Vistar Foundation</title>

  <!-- Fonts & Bootstrap -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --page-bg: #FFFAED;     /* warm canvas as index */
      --panel-bg: #ffffff;    /* white container */
      --text-dark: #071428;
      --muted: #4b5563;
      --accent: #ff8400;
      --radius: 14px;
    }

    html { scroll-behavior: smooth; }
    body{
      margin:0;
      min-height:100vh;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background-color: var(--page-bg);
      color: var(--text-dark);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
      padding: 2.5rem 1rem;
    }

    /* full-page floral background (faded behind content) */
    body::before{
      content: "";
      position: fixed;
      inset: 0;
      background-image: url('flowers.jpg'); /* use assets/flowers.jpg if stored there */
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      opacity: 0.12;
      filter: blur(0.6px) saturate(1.05) grayscale(.08);
      pointer-events: none;
      user-select: none;
      z-index: -1;
    }

    /* central white panel */
    .panel {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--panel-bg);
      border-radius: var(--radius);
      box-shadow: 0 18px 40px rgba(2,6,23,0.06);
      padding: 2rem;
      color: var(--text-dark);
    }

    header { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1rem; }
    a.back { color:var(--text-dark); text-decoration:none; font-weight:600; }
    a.back:hover { color: var(--accent); }

    h1 { margin:0 0 .25rem; font-weight:700; }
    .muted { color: var(--muted); }

    /* founders grid */
    .founder {
      text-align:center;
      padding: 1rem;
      border-radius: 12px;
      transition: transform .18s ease, box-shadow .18s ease;
      background: linear-gradient(180deg, rgba(15,23,42,0.01), rgba(15,23,42,0.005));
    }
    .founder:hover { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(2,6,23,0.06); }

    .founder-img {
      width: 160px;
      height: 160px;
      border-radius: 12px;
      object-fit: cover;
      display:block;
      margin: 0 auto 0.9rem;
      border: 1px solid rgba(15,23,42,0.06);
      background: #f6f6f6;
    }

    .founder-name { font-weight:700; margin-bottom:0.25rem; }
    .founder-role { color:var(--muted); font-size:0.95rem; margin-bottom:0.6rem; }

    @media (max-width: 767px) {
      .founder-img { width:120px; height:120px; }
    }
  </style>
</head>
<body>
  <main class="panel" role="main" aria-labelledby="team-heading">
    <header>
      <a href="index.html" class="back" aria-label="Back to home">← Home</a>
      <div class="text-end muted" style="font-size:.95rem">Vistar Foundation</div>
    </header>

    <h1 id="team-heading">Our Founders</h1>
    <p class="muted">The three teenagers that have built Vistar brick by brick</p>

    <section class="mt-4">
      <div class="row g-4">
        <!-- Founder 1 -->
        <div class="col-md-4">
          <div class="founder" role="article" aria-labelledby="f1-name">
            <img src="assets/founder1.jpg" alt="Photo of Founder 1" class="founder-img" onerror="this.style.display='none';">
            <div id="f1-name" class="founder-name">Marutha Adhyun</div>
            <div class="founder-role">Founder</div>
            <p class="muted" style="font-size:.95rem">Details</p>
          </div>
        </div>

        <!-- Founder 2 -->
        <div class="col-md-4">
          <div class="founder" role="article" aria-labelledby="f2-name">
            <img src="assets/founder2.jpg" alt="Photo of Founder 2" class="founder-img" onerror="this.style.display='none';">
            <div id="f2-name" class="founder-name">Vihaan Singh Thakur</div>
            <div class="founder-role">Co-Founder</div>
            <p class="muted" style="font-size:.95rem">Details</p>
          </div>
        </div>

        <!-- Founder 3 -->
        <div class="col-md-4">
          <div class="founder" role="article" aria-labelledby="f3-name">
            <img src="assets/founder3.jpg" alt="Photo of Founder 3" class="founder-img" onerror="this.style.display='none';">
            <div id="f3-name" class="founder-name">Harshith Tapadia</div>
            <div class="founder-role">Co-Founder</div>
            <p class="muted" style="font-size:.95rem">Details</p>
          </div>
        </div>
      </div>
    </section>

    <footer class="mt-4" style="text-align:center; color:var(--muted); font-size:.95rem;">
      © <span id="year"></span> Vistar Foundation
    </footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
