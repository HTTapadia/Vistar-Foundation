<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Workshop #2 | Vistar Foundation</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--bg:#0f1723;--muted:#000000;--accent:#4f9cff;--radius:14px;}
    html{scroll-behavior:smooth}
    body{font-family:Montserrat,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;background:#FFFAED;color:#FFFAED;min-height:100vh;}
    .container-lg{max-width:1280px;}
    .randomahh{color:black;font-weight:600;}
    header.navbar{background:#010461be;backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,0.03);}
    .brand{display:flex;align-items:center;gap:.6rem;font-weight:700;color:#fff;}
    .brand .logo{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;box-shadow:0 6px 18px rgba(79,156,255,0.12), inset 0 -4px 10px rgba(255,255,255,0.04);}    
    .logo img{width:100%;height:100%;object-fit:cover;display:block;}
    .logo-fallback{display:none;font-weight:700;color:var(--accent);}
    .page-shell{padding:5rem 0 3rem;}
    .card-soft{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(44,14,104,0.03);border-radius:var(--radius);padding:1.25rem;box-shadow:0 8px 30px rgba(2,6,23,0.55);color:#fff;}
    .btn-primary{background:#ff8400;border:none;color:#021124;font-weight:600;box-shadow:0 10px 30px rgba(79,156,255,0.14);}    
    .muted{color:white;}
    body::before{content:"";position:fixed;inset:0;background-image:url('flowers.jpg');background-size:cover;background-position:center center;background-repeat:no-repeat;opacity:0.12;filter:blur(0.6px) saturate(1.05) grayscale(.08);pointer-events:none;z-index:-1;}
  </style>
</head>
<body>
  <header class="navbar sticky-top">
    <div class="container container-lg d-flex align-items-center justify-content-between py-2">
      <a href="index.html" class="brand text-decoration-none">
        <span class="logo" aria-hidden="true"><img src="vistaractual.jpg" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';"><span class="logo-fallback">V</span></span>
        <span style="letter-spacing:.2px;">Vistar Foundation</span>
      </a>
    </div>
  </header>

  <main class="page-shell">
    <section class="container container-lg">
      <div class="row g-4 align-items-stretch">
        <article class="col-lg-7">
          <div class="card-soft h-100">
            <p class="randomahh mb-2">Workshop #2</p>
            <h1 class="randomahh h2 mb-3"> </h1>
            <p class="randomahh"> </p>
            <a class="btn btn-primary mt-2" href="index.html#get-involved">Home</a>
          </div>
        </article>
        <aside class="col-lg-5">
        </aside>
      </div>
    </section>
  </main>

  <footer>
    <div class="container container-lg d-flex justify-content-between align-items-center">
      <div class="randomahh">&copy; <span id="year"></span> Vistar Foundation</div>
      <div class="randomahh">For the greater good • <a class="randomahh" href="#">Privacy</a></div>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
